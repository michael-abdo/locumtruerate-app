<!DOCTYPE html>
<html>
<head>
    <title>Debug Login Test</title>
</head>
<body>
    <h1>Login Debug Test</h1>
    <button onclick="testLogin()">Test Login</button>
    <div id="results"></div>
    
    <!-- Load auth.js to test if functions are available -->
    <script src="js/auth.js"></script>
    
    <script>
        async function testLogin() {
            const results = document.getElementById('results');
            results.innerHTML = 'Testing login...';
            
            try {
                console.log('Starting login test...');
                console.log('login function available:', typeof login);
                console.log('isAuthenticated function available:', typeof isAuthenticated);
                
                // Test using the auth.js login function
                if (typeof login === 'function') {
                    console.log('Using auth.js login function...');
                    const result = await login('testuser@example.com', 'password123');
                    console.log('Auth.js result:', result);
                    
                    results.innerHTML = `
                        <h3>Auth.js Test Results:</h3>
                        <p><strong>Success:</strong> ${result.success}</p>
                        <p><strong>User:</strong> ${result.user ? JSON.stringify(result.user) : 'N/A'}</p>
                        <p><strong>Error:</strong> ${result.error || 'N/A'}</p>
                    `;
                } else {
                    console.log('Auth.js login function not available, testing direct API...');
                    
                    const response = await fetch('https://locumtruerate-staging-66ba3177c382.herokuapp.com/api/v1/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            email: 'testuser@example.com',
                            password: 'password123'
                        })
                    });
                    
                    const data = await response.json();
                    
                    results.innerHTML = `
                        <h3>Direct API Test Results:</h3>
                        <p><strong>Status:</strong> ${response.status}</p>
                        <p><strong>Success:</strong> ${data.success || 'N/A'}</p>
                        <p><strong>Message:</strong> ${data.message || 'N/A'}</p>
                        <p><strong>Auth.js login function:</strong> Not available</p>
                    `;
                }
                
            } catch (error) {
                console.error('Login test failed:', error);
                results.innerHTML = `<p style="color: red;"><strong>Error:</strong> ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
